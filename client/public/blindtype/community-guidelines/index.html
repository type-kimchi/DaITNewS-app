    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <a class="brand-mark" href="../">BLINDTYPE</a>
        <nav class="nav" aria-label="법적 안내">
          <a href="../privacy/">개인정보처리방침</a>
          <a href="../terms/">이용약관</a>
        </nav>
      </header>
      <p class="eyebrow">Community Guidelines</p>
      <h1>커뮤니티 가이드라인</h1>
      <p class="lead">BLINDTYPE의 대화는 사진보다 먼저 말투와 선택이 남는 공간입니다.</p>
      <div class="content">
        <section>
          <h2>금지되는 대화</h2>
          <p>괴롭힘, 모욕, 협박, 성적 강요, 개인정보 요구, 연락처 강요, 사칭, 불법 콘텐츠 공유를 금지합니다.</p>
        </section>
        <section>
          <h2>신고와 차단</h2>
          <p>불편한 대화는 즉시 신고하거나 차단할 수 있습니다. 신고된 내용은 안전 조치를 위해 검토될 수 있습니다.</p>
        </section>
        <section>
          <h2>상호 존중</h2>
          <p>거절은 관계의 일부입니다. 상대가 원하지 않는 대화나 만남을 반복해서 요구하지 마세요.</p>
        </section>
      </div>
    </main>
